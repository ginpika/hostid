name: Docker Build and Verify

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a running publication. Obsolete PR checks may be cancelled.
concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      repository: ${{ steps.names.outputs.repository }}
      candidate: ${{ steps.names.outputs.candidate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare image names
        id: names
        run: |
          echo "repository=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "candidate=build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Validate workflows
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
      - name: Check shell scripts
        run: shellcheck -s sh scripts/smoke-containers.sh frontend/docker-entrypoint.sh backend/docker-entrypoint.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - name: Install dependencies and generate Prisma client
        run: |
          npm ci --workspace=frontend --no-audit --no-fund
          npm ci --prefix backend --ignore-scripts --no-audit --no-fund
          npm run db:generate --prefix backend
      - name: Check Compose ports and service configuration
        run: node scripts/check-compose.mjs
      - name: Check frontend and backend types
        run: |
          npm run typecheck --workspace=frontend
          npm run typecheck --prefix backend

  build:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    env:
      FRONTEND_IMAGE: ghcr.io/${{ needs.verify.outputs.repository }}-frontend
      BACKEND_IMAGE: ghcr.io/${{ needs.verify.outputs.repository }}-backend
      CANDIDATE: ${{ needs.verify.outputs.candidate }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        if: matrix.arch == 'arm64'
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build frontend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: frontend/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          provenance: false
          tags: hostid-frontend:smoke
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=frontend-${{ matrix.arch }}
          cache-to: type=gha,scope=frontend-${{ matrix.arch }},mode=max
      - name: Build backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          file: backend/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          provenance: false
          tags: hostid-backend:smoke
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=backend-${{ matrix.arch }}
          cache-to: type=gha,scope=backend-${{ matrix.arch }},mode=max
      - name: Verify container startup, proxy, SMTP, and persistence
        run: bash scripts/smoke-containers.sh hostid-frontend:smoke hostid-backend:smoke linux/${{ matrix.arch }}
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push tested candidates
        if: github.event_name != 'pull_request'
        run: |
          docker tag hostid-frontend:smoke "$FRONTEND_IMAGE:$CANDIDATE"
          docker tag hostid-backend:smoke "$BACKEND_IMAGE:$CANDIDATE"
          docker push "$FRONTEND_IMAGE:$CANDIDATE"
          docker push "$BACKEND_IMAGE:$CANDIDATE"

  publish:
    if: github.event_name != 'pull_request'
    needs: [verify, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    # Serialize all refs that may update shared release aliases.
    concurrency:
      group: hostid-ghcr-publish
      cancel-in-progress: false
    env:
      FRONTEND_IMAGE: ghcr.io/${{ needs.verify.outputs.repository }}-frontend
      BACKEND_IMAGE: ghcr.io/${{ needs.verify.outputs.repository }}-backend
      CANDIDATE: ${{ needs.verify.outputs.candidate }}
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check branch freshness under the publication lock
        id: fresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=false
          if [[ "$GITHUB_REF_TYPE" == branch ]]; then
            head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/${GITHUB_REF#refs/}" --jq '.object.sha')
            if [[ "$head" == "$GITHUB_SHA" ]]; then current=true; fi
          fi
          echo "current=$current" >> "$GITHUB_OUTPUT"
      - name: Frontend release tags
        id: frontend
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          flavor: latest=false
          tags: |
            type=sha,format=long
            type=ref,event=branch,enable=${{ steps.fresh.outputs.current == 'true' }}
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ steps.fresh.outputs.current == 'true' && github.ref_name == github.event.repository.default_branch }}
      - name: Backend release tags
        id: backend
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.BACKEND_IMAGE }}
          flavor: latest=false
          tags: |
            type=sha,format=long
            type=ref,event=branch,enable=${{ steps.fresh.outputs.current == 'true' }}
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ steps.fresh.outputs.current == 'true' && github.ref_name == github.event.repository.default_branch }}
      - name: Assemble both revisions before updating release aliases
        run: |
          for image in "$FRONTEND_IMAGE" "$BACKEND_IMAGE"; do
            docker buildx imagetools create --tag "$image:sha-$GITHUB_SHA" \
              "$image:$CANDIDATE-amd64" "$image:$CANDIDATE-arm64"
          done
      - name: Promote tested revisions
        env:
          FRONTEND_TAGS: ${{ steps.frontend.outputs.tags }}
          BACKEND_TAGS: ${{ steps.backend.outputs.tags }}
        shell: bash
        run: |
          promote() {
            local image="$1" tags="$2" tag
            local -a args=()
            while IFS= read -r tag; do
              if [[ -n "$tag" && "$tag" != "$image:sha-$GITHUB_SHA" ]]; then
                args+=(--tag "$tag")
              fi
            done <<< "$tags"
            if (( ${#args[@]} )); then
              docker buildx imagetools create "${args[@]}" "$image:sha-$GITHUB_SHA"
            fi
          }
          promote "$FRONTEND_IMAGE" "$FRONTEND_TAGS"
          promote "$BACKEND_IMAGE" "$BACKEND_TAGS"
          echo "Both architectures passed container checks. Deploy the matching pair with IMAGE_TAG=sha-$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
