services:
  hostid-full:
    image: ghcr.io/ginpika/hostid-full:${IMAGE_TAG:-latest}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
      - "${SMTP_PORT:-25}:2525"
    env_file:
      - ./hostid.env
    environment:
      NODE_ENV: production
      PORT: "3000"
      SMTP_PORT: "2525"
      DATABASE_URL: file:/app/data/prod.db
      HOSTID_WEB_ROOT: /app/public
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    volumes:
      - backend_data:/app/data
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
      - backend_avatars:/app/avatars
    restart: unless-stopped

volumes:
  backend_data:
  backend_uploads:
  backend_logs:
  backend_avatars:
