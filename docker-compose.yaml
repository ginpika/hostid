services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    env_file:
      - ./frontend/.env
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${SMTP_PORT:-25}:2525"
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-3001}:3001"
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: "3001"
      SMTP_PORT: "2525"
      DATABASE_URL: file:/app/data/prod.db
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    volumes:
      - backend_data:/app/data
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
      - backend_avatars:/app/avatars
    restart: unless-stopped

volumes:
  backend_data:
  backend_uploads:
  backend_logs:
  backend_avatars:
